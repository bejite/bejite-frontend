name: Bejite Frontend CI

# -------------------------------------------------------------
# CI TRIGGERS
# Run this workflow only when:
#  - Code is pushed to main or dev
#  - A pull request is opened to main or dev
# -------------------------------------------------------------
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Playwright defaults to localhost:3001; in CI hit the same API as the app build.
      E2E_API_URL: ${{ secrets.VITE_API_URL }}

    steps:

      # -------------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 2. Setup Node.js (20+ required by Playwright)
      # -------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # -------------------------------------------------------------
      # 3. Install dependencies using npm ci
      # -------------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------------------------------
      # 4. Run ESLint if the script exists in package.json
      # -------------------------------------------------------------
      - name: Run ESLint
        run: npm run lint --if-present

      # -------------------------------------------------------------
      # 5. Build the production-ready frontend
      # -------------------------------------------------------------
      - name: Build frontend
        run: npm run build

      # -------------------------------------------------------------
      # 6. Confirm the build output exists (optional debugging step)
      # -------------------------------------------------------------
      - name: Confirm build output
        run: ls -R dist

      # -------------------------------------------------------------
      # 7. Upload build artifact to GitHub Actions storage
      # -------------------------------------------------------------
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

      # -------------------------------------------------------------
      # 8. Playwright E2E — user app (happy paths skip if E2E_* unset)
      # -------------------------------------------------------------
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run user app E2E
        run: npm run test:e2e

      # -------------------------------------------------------------
      # 9. Playwright E2E — admin app
      # -------------------------------------------------------------
      - name: Install admin dependencies
        working-directory: Admin-frontend
        run: npm ci

      - name: Install Admin Playwright Chromium
        working-directory: Admin-frontend
        run: npx playwright install --with-deps chromium

      - name: Run admin app E2E
        working-directory: Admin-frontend
        run: npm run test:e2e

      # -------------------------------------------------------------
      # 10. Trigger DevOps CI ONLY when main is updated
      # -------------------------------------------------------------
      - name: Trigger DevOps CI
        if: github.ref == 'refs/heads/main'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Triggering DevOps CI for MAIN branch..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/bejite/bejite-devops/actions/workflows/devops-ci.yml/dispatches \
            -d '{"ref": "main", "inputs": {"source_repo": "frontend"}}'
